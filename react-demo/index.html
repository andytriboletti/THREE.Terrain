<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THREE.Terrain with React Three Fiber & ECCtrl</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #root {
      width: 100%;
      height: 100%;
    }
    .info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      z-index: 100;
    }
    .controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div class="info">
    <h3>THREE.Terrain with React Three Fiber & ECCtrl</h3>
    <p>A demo showing THREE.Terrain with character movement using ECCtrl</p>
  </div>
  <div class="controls">
    <p>WASD = Move, Space = Jump, Shift = Run</p>
    <p>Mouse = Look around, Mouse Wheel = Zoom</p>
    <p>P = Toggle Physics Debug, O = Toggle Orbit Controls</p>
  </div>
  <script type="module" src="/index.jsx"></script>
</body>
</html>
